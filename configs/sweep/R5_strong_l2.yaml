# Chunk-3.5 sweep — R5: aggressive latent L2. Ablation of R0's λ_latent_L2.
# Hypothesis: tighter L2 reg (1e-2 vs 1e-4) compresses z_s more aggressively,
# possibly forcing a smoother manifold. May hurt training-set fit if too tight.
run_id: R5_strong_l2
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 8
l_head_weight: 0.1
lambda_latent_l2: 1e-2

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
