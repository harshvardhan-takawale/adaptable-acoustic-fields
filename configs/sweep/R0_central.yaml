# Chunk-3.5 sweep — R0 central bet.
# Combines all three fixes for the Chunk-3 latent-collapse failure:
#   - smaller HashGrid (log2_hashmap_size 18 → 14, n_levels 20 → 14)
#   - smaller latent (32 → 8 dims)
#   - L-head auxiliary supervision (predict L from z_s)
run_id: R0_central
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 8
l_head_weight: 0.1
lambda_latent_l2: 1e-4

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
