# Chunk-3.5 sweep — R3: no L-head. Ablation testing whether smaller capacity
# alone (without auxiliary L supervision) is enough to fix the Chunk-3 collapse.
# Hypothesis: smaller hash + smaller latent may be sufficient; if R3 ≈ R0, the
# L-head is decorative.
run_id: R3_no_lhead
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 8
l_head_weight: 0.0
lambda_latent_l2: 1e-4

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
