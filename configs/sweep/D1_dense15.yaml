# Chunk 3.7 I1 — denser sweep retrain on 15-room dense_15 dataset.
# Architecture / training knobs mirror C2_latent_jitter (the strongest Chunk-3.6
# config: linear L-head, 14-bit hash, 14 levels, 8-D latent, latent jitter σ=0.1,
# λ_latent=1e-4). Only the training set changes (7 → 15 rooms at 0.2 m spacing).
# Hypothesis: more interpolation anchors → smoother latent-to-spectrum response
# at unseen L, lifting modal zero-shot LSD below the 2 dB bar.
run_id: D1_dense15
data_sweep: configs/sweeps/dense_15.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 8
l_head_weight: 0.1
l_head_arch: linear
lambda_latent_l2: 1e-4

conditioning_type: concat
latent_jitter_sigma: 0.1

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
