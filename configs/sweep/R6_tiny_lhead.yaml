# Chunk-3.5+ addendum — R6: linear L-head.
# Same architecture as R0 but with a LINEAR L-head (Linear(d→1), no nonlinearity).
# Hypothesis: linear L-head forces z_s to be linearly readable as L → strongest
# inductive bias toward a 1-D latent manifold parameterised by L. The R0-R5
# mlp_32 head can fit any (z_s → L) mapping cheaply, so a low L_lhead doesn't
# constrain z_s; a linear head makes the constraint structural.
run_id: R6_tiny_lhead
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 8
l_head_weight: 0.1
l_head_arch: linear
lambda_latent_l2: 1e-4

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
