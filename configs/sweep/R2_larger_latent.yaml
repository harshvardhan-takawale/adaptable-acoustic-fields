# Chunk-3.5 sweep — R2: larger latent. Ablation of R0's latent dim.
# Hypothesis: 8-dim latent may be too tight a bottleneck; 16 dims gives the
# auto-decoder more room while still being far below Chunk-3's 32.
run_id: R2_larger_latent
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 14
n_levels: 14
latent_dim: 16
l_head_weight: 0.1
lambda_latent_l2: 1e-4

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
