# Chunk-3.5 sweep — R1: smaller hash. Ablation of R0's hash size.
# Hypothesis: if R0 still over-fits, an even smaller hash (12 bits → 4K entries
# per level vs R0's 14-bit 16K) forces more aggressive use of the z_s latent.
run_id: R1_smaller_hash
data_sweep: configs/sweeps/dense.yaml

log2_hashmap_size: 12
n_levels: 14
latent_dim: 8
l_head_weight: 0.1
lambda_latent_l2: 1e-4

n_iters: 30000
batch_size: 8
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
n_pts_per_ray: 32
n_azi: 64
val_every: 1000
ckpt_every: 2500
