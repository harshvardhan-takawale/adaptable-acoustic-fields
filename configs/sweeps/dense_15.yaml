# Chunk 3.7 I1: denser training sweep — 15 rooms at 0.2 m spacing covering
# [3.0, 5.8] m. Existing track_a dataset already has 3 of these (3.0, 4.0, 5.0);
# the remaining 12 are generated by scripts/build_datasets.py (idempotent —
# skips any L_*.h5 already on disk). The test_L set is identical to dense.yaml
# so cross-sweep comparison is apples-to-apples.
W: 4.0
alpha: 0.15
fs: 4096
n_time_samples: 8192
source_pos: [0.5, 0.5]
train_L: [3.0, 3.2, 3.4, 3.6, 3.8, 4.0, 4.2, 4.4, 4.6, 4.8, 5.0, 5.2, 5.4, 5.6, 5.8]
test_L:  [3.25, 3.75, 4.25, 4.75, 5.25, 5.75]
