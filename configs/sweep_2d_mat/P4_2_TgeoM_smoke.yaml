# P4-2 Task A -- Arm T-geo+m: does moving m_hat OUT of the shared token MLP restore edit
# linearity?
#
# P4-1's geom_token beat Arm C on every reconstruction metric but its edit_bw_slope was LOWER
# than Arm C's in all five frozen splits (worst S4: 0.464 vs 0.789) while edit_gain overshot
# everywhere -- it reconstructs the field better and responds to an EDIT less linearly (Q20).
#
# Hypothesis under test: entangling m_hat in the shared token MLP is what cost the linear-in-m
# calibration, because one 26-d vector must carry position, extent AND material through an
# encoder shared across every edge. This arm keeps geometry exactly where P4-1 showed it works
# (19-d geometry-only tokens) and returns material to the channel where it was already proven --
# the per-wall m_linear block, byte-identical to m_linear_features_2d[32:60], concatenated with
# the pooled token embedding AFTER pooling so it never passes through the token MLP.
#
# Identical to P4_1_Tgeo.yaml in every other respect, so a difference is attributable to where
# m_hat lives. DO NOT JUDGE BEFORE 30K: T-geo trailed Arm C until ~22K and finished ahead.
run_id: smoke_TgeoM
rooms_yaml: configs/sweeps_2d_mat/p3_2_train.yaml
data_dir: data/track_c_2d

band_max_hz: 300

# --- DELTA 1/3: token-only geometry, 12 padded slots x 26 + a 12-d validity mask ---
cond_source: geom_token_m
cond_dim: 268
conditioning_type: film
latent_dim: 16               # unused by this arm; kept > 0 to satisfy the model's check

# --- 2D backbone recipe (matches Arm C) ---
log2_hashmap_size: 18
n_levels: 20
per_level_scale: 1.5
n_azi: 64
n_pts_per_ray: 64

# --- DELTA 2/3 and 3/3: the world scale, and the hash resolution that MUST move with it ---
# At world_scale 10 a 6 m room spans 0.6 hash units instead of the legacy 3.0, i.e. 5x fewer
# cells across the room. base_resolution 16 -> 80 (= 16 * 1.5^4) restores metres-per-cell, so
# Gate 0 tests the tokens rather than a resolution regression. These two keys move together.
world_scale: 10.0
base_resolution: 80

# --- optimization (identical to Arm C) ---
n_iters: 300
batch_size: 8
rx_per_config: 4
grad_accum_steps: 2
lr_network: 2.0e-4

val_every: 150
val_max_configs: 20
ckpt_every: 300
ckpt_keep_last: 1
early_stop_warmup: 100000
early_stop_patience: 10000
early_stop_min_rel_improvement: 0.003
configs_manifest: configs/sweeps_2d_mat/p3_2b_manifest.json
max_rows_per_render: 8
