# P4-9 2b CTL (D180 / D181 A8, A11, E2): R0 @120K fine-tuned 30K more steps on the GX corpus with NO directional loss --
# the control for DIR and DIR-G, which differ from it ONLY in their directional term (same batches: p49_mode draws
# batch indices from a dedicated generator). GENERATED from P4_8_R0.yaml -- differs ONLY in run_id, n_iters,
# early_stop_warmup, the warm-start keys and p49_mode. Warm start from R0 @120K; lr restart 5e-5 -> 1.25e-4 over 1K
# steps, cosine -> 5e-5 at 150K. Reads at 130K / 140K / 150K. Output: outputs/p4_9/arms/CTL.
