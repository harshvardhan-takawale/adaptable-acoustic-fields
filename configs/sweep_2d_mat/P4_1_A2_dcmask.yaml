run_id: p4_1_A2_dcmask
rooms_yaml: configs/sweeps_2d_mat/p3_2_train.yaml
data_dir: data/track_p3_3fast_A

# --- P3-2 protocol: band-limited to the modal regime (bins 0..600) ---
band_max_hz: 300

# --- conditioning arm: physical parameters -> Fourier features -> FiLM, no latent table ---
cond_source: m_token
cond_dim: 448
conditioning_type: film
latent_dim: 16               # unused by this arm; kept >0 to satisfy the model's check

# --- 2D backbone recipe (Phase-1 lineage, NOT the 3D P3-1 hashgrid) ---
log2_hashmap_size: 18
n_levels: 20
per_level_scale: 1.5
n_azi: 64
n_pts_per_ray: 64

# --- optimization ---
n_iters: 30000
batch_size: 8
rx_per_config: 4
grad_accum_steps: 2
lr_network: 2.0e-4

# --- validation on HELD-OUT receivers of training configs ---
val_every: 2000
val_max_configs: 40
ckpt_every: 2000
ckpt_keep_last: 10
early_stop_warmup: 10000
early_stop_patience: 10000
early_stop_min_rel_improvement: 0.003
configs_manifest: configs/sweeps_2d_mat/p3_3fast_trackA_manifest.json
max_rows_per_render: 8

# P4-1: mask the FDTD corpus's DC/compliance term out of the GRADIENT (eval band unchanged).
#
# Measured on the A2 checkpoint at iter 30000 (outputs/p4_1/dc_fix/loss_contribution.json):
# bins 0-39 are 6.7% of the band by count but command 23.7% of the weighted objective -- a
# ~3.5x over-representation of bins that contain no modal content whatsoever (the first room
# mode is 28.6-57 Hz across this family). Per-bin enrichment is 9.0x on L_spec_real and 4.4x on
# L_spec_imag; L_amp (log10) and L_phase (cosine) are untouched at 0.2x and 0.0x, exactly as
# predicted from the loss definitions.
#
# So the "DC dominates the loss" hypothesis is PARTIAL, not confirmed -- it commands about a
# quarter of the gradient, not a majority. The retrain runs anyway because a quarter of the
# gradient budget spent on bins with zero modal content is recoverable at no measured cost.
loss_band_lo_hz: 20.0
