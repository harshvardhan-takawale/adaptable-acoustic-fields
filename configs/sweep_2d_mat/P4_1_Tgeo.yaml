# P4-1 Stage 0 -- Arm T-geo: can boundary tokens carry ALL the geometry?
#
# Identical to P3_2b_C.yaml (Arm C) in every respect EXCEPT the three lines marked below, so a
# Gate 0 difference is attributable to the conditioning and nothing else. Same corpus, same
# manifest sha, same recipe, same optimizer, same iteration budget.
#
# The arm drops the global (L, W) Fourier prefix entirely and expresses the room as 4 boundary
# tokens [cx, cy, nx, ny, extent, m_hat] in ABSOLUTE metres / WORLD_SCALE (D64). That is the
# last shoebox-specific component: a Z-corridor has no meaningful (L, W).
run_id: p4_1_Tgeo
rooms_yaml: configs/sweeps_2d_mat/p3_2_train.yaml
data_dir: data/track_c_2d

band_max_hz: 300

# --- DELTA 1/3: token-only geometry, 12 padded slots x 26 + a 12-d validity mask ---
cond_source: geom_token
cond_dim: 324
conditioning_type: film
latent_dim: 16               # unused by this arm; kept > 0 to satisfy the model's check

# --- 2D backbone recipe (matches Arm C) ---
log2_hashmap_size: 18
n_levels: 20
per_level_scale: 1.5
n_azi: 64
n_pts_per_ray: 64

# --- DELTA 2/3 and 3/3: the world scale, and the hash resolution that MUST move with it ---
# At world_scale 10 a 6 m room spans 0.6 hash units instead of the legacy 3.0, i.e. 5x fewer
# cells across the room. base_resolution 16 -> 80 (= 16 * 1.5^4) restores metres-per-cell, so
# Gate 0 tests the tokens rather than a resolution regression. These two keys move together.
world_scale: 10.0
base_resolution: 80

# --- optimization (identical to Arm C) ---
n_iters: 60000
batch_size: 8
rx_per_config: 4
grad_accum_steps: 2
lr_network: 2.0e-4

val_every: 2000
val_max_configs: 88
ckpt_every: 2000
ckpt_keep_last: 10
early_stop_warmup: 10000
early_stop_patience: 10000
early_stop_min_rel_improvement: 0.003
configs_manifest: configs/sweeps_2d_mat/p3_2b_manifest.json
max_rows_per_render: 8
