# P4-9 2a (D180 / D181 A8): S2 CONTINUED to 240K, so each of its 2000 rooms is seen as often as R0 @120K's 1000.
# GENERATED from P4_8_S2.yaml -- differs ONLY in run_id, n_iters, early_stop_warmup and the warm-start keys.
# Warm start: weights + Adam moments from S2 @120K; lr restart 5e-5 -> 1.25e-4 (R0's lr at 60K) over 1K steps,
# then cosine -> 5e-5 at 240K (closed form; a plain cosine would continue from the loaded 5e-5 and never restart).
# Pre-registered (D180): HF >= 0.56 AND UF 25-100 Hz >= 0.49. Reads at 180K and 240K (150K / 210K interim).
# 2000 rooms preload 7.7 GB of targets: 48 GB card (L40S). Output: outputs/p4_9/arms/S2X (NOT S2's directory).
