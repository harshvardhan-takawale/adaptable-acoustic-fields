# P4-4 Task 3: does CORNER COUNT extrapolate one step at a time?
#
# 300 training rooms -- 60 each of rect (0 reflex corners, 4 tokens), L (1, 6), U (2, 8),
# T (2, 8) and DN (2, 8) -- with 50 held-out, 10 per family. Z (3 corners, 10 tokens)
# becomes Stage 3 only if the 2-corner families hold.
#
# POOLING: attn_residual_extent, chosen on Task 2's evidence rather than assumed. It is
# the best Gate-2 arm measured (C250 in-slab 0.8420, out-slab 0.8359 -- the best of any
# arm in the phase) and it beats masked_mean by +0.0316 in-slab on an IDENTICAL corpus
# and test set (C92 vs P4-3 D). Task 2 also showed why that choice is not obvious: the
# same arm is WORSE on val LSD (4.31 vs 2.51) and on the fixed-bbox depth sweep, so the
# two metric families disagree in sign and the gated one was used to decide.
#
# val_max_configs 60, not 40: selection is stratified THEN truncated, and this corpus has
# 20 strata (5 families x 4 depth buckets) against the notch family's 5. At 40 the val set
# would be ~2 configs per stratum, and early stopping reads that metric.

run_id: p4_4_FAM
rooms_yaml: configs/sweeps_2d_mat/p3_2_train.yaml   # unused; the manifest supplies the shapes
data_dir: data/track_p4_4_family
configs_manifest: configs/sweeps_2d_mat/p4_4_family_manifest.json

band_max_hz: 300
cond_source: geom_token
cond_dim: 324
conditioning_type: film
latent_dim: 16

log2_hashmap_size: 18
n_levels: 20
per_level_scale: 1.5
n_azi: 64
n_pts_per_ray: 64
world_scale: 10.0
base_resolution: 80
token_pool: attn_residual_extent
loss_band_lo_hz: 0.0

# Rows per BACKWARD = (batch_size // rx_per_config) * rx_per_config, and a renderer row is
# ~134 MB at n_pts_per_ray=64 -- 8 is P4-1's proven footprint on a 24 GB card. A first attempt
# at batch_size 16 / rx 4 / accum 1 put 16 rows in ONE backward and OOMed immediately; the
# accumulation steps do NOT share the memory, each is its own backward.
#
# This shape keeps 8 rows/backward and 16 rows/step exactly as P4-1, while raising the number of
# DISTINCT SHAPES per backward from 2 to 4 -- which matters far more with 60 shapes than with
# 960 material variants.
n_iters: 60000
batch_size: 8
rx_per_config: 2
grad_accum_steps: 2
lr_network: 2.0e-4

# val_max_configs >= the stratum count: the trainer truncates the val list in MANIFEST-INDEX
# order AFTER stratifying, so a smaller value would quietly make the val curve one corner of
# the shape space -- and early stopping reads it.
val_every: 2000
val_max_configs: 60
ckpt_every: 2000
ckpt_keep_last: 3
early_stop_warmup: 10000
early_stop_patience: 10000
early_stop_min_rel_improvement: 0.003
max_rows_per_render: 8
