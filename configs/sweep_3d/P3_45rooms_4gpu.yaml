run_id: P3_45rooms_4gpu
rooms_yaml: configs/sweeps_3d/train_rooms.yaml

# P2-3 converged run — Run C's recipe (eff-batch 64, n_pts 32) across 4 GPUs.
# In --ddp mode batch_size is PER-RANK; global effective = world_size × batch_size.
# Launched with --ntasks=4 → 4 × 16 = effective batch 64 (D35).
# bs_micro = batch_size // grad_accum_steps = 16 // 2 = 8 (proven-fitting on A6000).
# LR unchanged from the 2-GPU runs (no LR scaling — eff-batch held at 64, D35).

latent_dim: 16
log2_hashmap_size: 18
n_levels: 16
per_level_scale: 1.38
conditioning_type: film
latent_jitter_sigma: 0.1
l_head_enabled: true
l_head_weight: 0.1

# Optimization (D36: 60K user cap; eff-batch 64 held)
n_iters: 60000
batch_size: 16          # PER-RANK (×4 ranks = 64 global effective)
grad_accum_steps: 2     # per-rank micro = 16 // 2 = 8
lr_network: 2e-4
lr_latent: 1e-3
lambda_latent: 1e-4

# Renderer (Run C value)
n_azi: 16
n_ele: 16
n_pts_per_ray: 32

# Cadences — 4-GPU runs are long: checkpoint every 5K, val every 2K (D36).
val_every: 2000
ckpt_every: 5000

# Relaxed early-stop: 0.3% improvement over a 10K window, warmup 10K (D36).
early_stop_warmup: 10000
early_stop_patience: 10000
early_stop_min_rel_improvement: 0.003
