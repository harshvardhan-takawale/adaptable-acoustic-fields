run_id: P3_sanity
rooms_yaml: configs/sweeps_3d/train_rooms.yaml

# P2-3 DDP sanity gate — identical recipe to P3_45rooms_4gpu, 2000 iters only.
# Confirms 4-rank NCCL all-reduce works (no hang/desync), throughput scales
# (~0.6 it/s vs single-GPU eff-64's 0.157), and val@2000 descends like B's
# 45-room early curve. Throwaway output dir.

latent_dim: 16
log2_hashmap_size: 18
n_levels: 16
per_level_scale: 1.38
conditioning_type: film
latent_jitter_sigma: 0.1
l_head_enabled: true
l_head_weight: 0.1

n_iters: 2000
batch_size: 16          # PER-RANK (×4 ranks = 64 global effective)
grad_accum_steps: 2
lr_network: 2e-4
lr_latent: 1e-3
lambda_latent: 1e-4

n_azi: 16
n_ele: 16
n_pts_per_ray: 32

val_every: 500
ckpt_every: 2000
early_stop_warmup: 100000   # disable early-stop for the gate
early_stop_patience: 2000
early_stop_min_rel_improvement: 0.01
