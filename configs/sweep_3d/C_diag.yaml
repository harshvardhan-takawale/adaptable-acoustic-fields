run_id: C_10rm_b64
rooms_yaml: configs/sweeps_3d/diag_10rooms.yaml

# P2-2.5 Run C — high-coverage ceiling test on the 10-room subset.
# Effective batch = 64 via gradient accumulation (micro=8 × accum=8) so we
# fit on A6000 (48 GB). Mathematically identical to direct batch=64.
# Per-iter coverage: 64 / 5120 ≈ 1.25% (~70× M1's, ~4× Run A's).

# Architecture identical to M1 (D19-D31).
latent_dim: 16
log2_hashmap_size: 18
n_levels: 16
per_level_scale: 1.38
conditioning_type: film
latent_jitter_sigma: 0.1
l_head_enabled: true
l_head_weight: 0.1

# Optimization — Run-C variables.
# Effective batch = 64, split as micro=8 × accum=8 so each micro-step forward
# (8 rx × n_pts=32 = 256 ray-point units ≈ 22 GB) fits the 48 GB A6000.
# IMPORTANT: `batch_size` is the EFFECTIVE batch (the trainer computes
# bs_micro = batch_size // grad_accum_steps = 64 // 8 = 8). An earlier config
# set batch_size=8 here, which gave bs_micro=1 and effective batch 8 — wrong.
n_iters: 30000
batch_size: 64
grad_accum_steps: 8
lr_network: 2e-4
lr_latent: 1e-3
lambda_latent: 1e-4

# Renderer — Run-C variables
n_azi: 16
n_ele: 16
n_pts_per_ray: 32

# Cadences
val_every: 1000
ckpt_every: 2500

# Standard early-stop (matches M1, A).
early_stop_warmup: 2000
early_stop_patience: 2000
early_stop_min_rel_improvement: 0.01
